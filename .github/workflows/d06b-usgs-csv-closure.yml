name: D06B USGS CSV closure

on:
  push:
    paths:
      - '.github/workflows/d06b-usgs-csv-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official 3.84 MB USGS CSV bundle
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.sciencebase.gov/catalog/file/get/620da87bd34e6c7e83ba9ba7?f=__disk__4d%2F61%2Ff7%2F4d61f78c120e863a4f4cae3d12d71deaa36fbc89'
          curl -L --fail --retry 3 -o /tmp/usgs_csv.zip "$URL"
          test "$(stat -c%s /tmp/usgs_csv.zip)" -eq 3843561
          rm -rf /tmp/usgs_csv
          mkdir -p /tmp/usgs_csv
          unzip -q /tmp/usgs_csv.zip -d /tmp/usgs_csv
          find /tmp/usgs_csv -type f -maxdepth 3 -printf '%P\t%s\n' | sort

      - name: Mirror CSV bundle and produce structural inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib, json, shutil

          src=Path('/tmp/usgs_csv')
          dst=Path('release_mirror/D06-20260831/D06B_USGS_csv')
          if dst.exists(): shutil.rmtree(dst)
          dst.mkdir(parents=True)
          inv=[]
          for p in sorted(src.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(src)
              out=dst/rel
              out.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,out)
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              row={'file':str(rel),'bytes':p.stat().st_size,'sha256':h}
              if p.suffix.lower()=='.csv':
                  with p.open('r',encoding='utf-8-sig',errors='replace',newline='') as f:
                      r=csv.reader(f)
                      header=next(r,[])
                      n=sum(1 for _ in r)
                  row['rows']=n
                  row['columns']=len(header)
                  row['header']=header
              inv.append(row)
          (dst/'_CSV_BUNDLE_INVENTORY.json').write_text(json.dumps(inv,indent=2,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release_mirror/D06-20260831/D06B_USGS_csv
          git commit -m 'D06B mirror official USGS CSV bundle' || exit 0
          git push
